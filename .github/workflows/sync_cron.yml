name: Daily Cross-Session Context Sync

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC - drift is a daily cadence, not hourly
  workflow_dispatch:

jobs:
  sync-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # FIXED: pasted key was "python-python-version" (invalid)
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run context sync audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m core.context_sync "${{ github.repository_owner }}" "${{ github.event.repository.name }}"
