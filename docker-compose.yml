version: '3.8'

# Local full-stack dev compose. NOTE: lab/Dockerfile is the LAB
# SANDBOX image (CMD sleep infinity, no app deps) - never use it for the
# backend. Railway deploys via railway.toml (Nixpacks + start.sh); this file
# mirrors that path for local use.

services:
  redis:
    image: redis:7-alpine
    container_name: luqi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: luqi-backend
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install --no-cache-dir -r requirements.txt && bash start.sh"
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:///data/luqi.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    depends_on:
      - redis
    restart: unless-stopped

  # REMOVED 2026-09-18: the 'collab' service built ./collab-service/Dockerfile,
  # a directory that does not exist in this repo - 'docker compose up' failed
  # at build. Re-add only when the collab-service source is committed.

  nginx:
    image: nginx:alpine
    container_name: luqi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
