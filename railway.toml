# ==============================================================================
# RAILWAY DEPLOYMENT CONFIGURATION — OMEGA-LUQI ENGINE
# Enterprise-Grade Multi-Agent Lifecycle & Memory Orchestration Spec
# ==============================================================================

[build]
# Dockerfile builder (2026-09-29): the Nixpacks auto-builder generated ARG/ENV
# instructions for every service variable, persisting runtime-only secrets in
# image history and tripping BuildKit's SecretsUsedInArgOrEnv warning (blanking
# values via nixpacks.toml [variables] did not help - the rule fires on names).
# With a hand-written Dockerfile no secret is ever declared as ARG/ENV; Railway
# injects JWT_SECRET_SIGNING_KEY, KIMI_API_KEY, LUQI_ADMIN_SECRET et al. into
# the runtime container only. nixpacks.toml stays in-tree as the rollback path.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Production start vector using bash orchestrator
startCommand = "bash start.sh"

# Healthcheck & Resiliency
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
healthcheckInterval = 15

# Rolling zero-downtime deployment strategy
deploymentStrategy = "ROLLING"

# Failure Recovery Policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Horizontal Scaling Vector
# Note: For multi-replica scaling (>1), ensure STATE_BACKEND=redis is active
numReplicas = 1

# Resource Guardrails (Optimized for High-Throughput Async Memory Engines)
[deploy.resources]
cpu = "2000m"
memory = "2048Mi"
