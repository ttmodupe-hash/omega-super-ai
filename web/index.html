function ChatPage(){
  const[msgs,setMsgs]=useState([{r:true,t:'Hello! I am Luqi AI. How can I help you?'}]);
  const[ip,setIp]=useState('');
  const[md,setMd]=useState('default');
  const[st,setSt]=useState('');
  const br=useRef(null);
  
  const snd=useCallback(async()=>{
    if(!ip.trim())return;
    const u=ip.trim();
    setMsgs(m=>[...m,{r:false,t:u}]);
    setIp('');
    setSt('');
    try{
      const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:u,mode:md,session_id:'s1'})});
      if(!r.body) throw new Error('No body');
      const rd=r.body.getReader();
      const dc=new TextDecoder();
      let b='';
      while(true){
        const{done,value}=await rd.read();
        if(done)break;
        b+=dc.decode(value,{stream:true});
        const ls=b.split('\n');
        b=ls.pop()||'';
        for(const ln of ls){
          if(ln.startsWith('data:')){
            try{
              const d=JSON.parse(ln.slice(5));
              if(d.type==='delta')setSt(p=>p+d.token);
              else if(d.type==='done'){setSt('');setMsgs(m=>[...m,{r:true,t:d.response||'Done'}])}
            }catch(e){}
          }
        }
      }
    }catch(e){
      setSt('');
      setMsgs(m=>[...m,{r:true,t:'Error: Could not connect to API server.'}]);
    }
  },[ip,md]);

  useEffect(()=>{br.current?.scrollIntoView({behavior:'smooth'})},[msgs,st]);

  return h('div',{className:'flex h-[calc(100vh-5rem)] gap-4'},
    h('div',{className:'hidden md:flex w-56 flex-col gap-2'},
      h('div',{className:'font-bold text-sm mb-2'},'Conversations'),
      CHAT.map(c=>h('div',{key:c.id,className:'p-2 rounded-lg hover:bg-gray-100 cursor-pointer text-sm'},h('p',{className:'font-medium truncate'},c.t),h('p',{className:'text-xs text-gray-500'},c.d))),
      h(B,{variant:'secondary',cls:'mt-auto flex items-center gap-2 justify-center'},I.plus(14),'New Chat')
    ),
    h('div',{className:'flex-1 flex flex-col bg-white rounded-lg shadow overflow-hidden'},
      h('div',{className:'flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide'},
        msgs.map((m,i)=>h('div',{key:i,className:`flex ${m.r?'justify-start':'justify-end'}`},
          h('div',{className:`max-w-[80%] px-4 py-2 rounded-lg text-sm ${m.r?'bg-gray-100 text-gray-900':'bg-indigo-600 text-white'}`,dangerouslySetInnerHTML:m.r?{__html:window.marked?marked.parse(m.t):m.t}:null},m.r?null:m.t)
        )),
        st&&h('div',{className:'flex justify-start'},h('div',{className:'max-w-[80%] px-4 py-2 rounded-lg text-sm bg-gray-100'},h('div',{dangerouslySetInnerHTML:{__html:window.marked?marked.parse(st+'|'):st+'|'}}),h('span',{className:'inline-block w-2 h-4 bg-indigo-500 ml-0.5 animate-pulse'}))),
        h('div',{ref:br})
      ),
      h('div',{className:'border-t p-3 flex gap-2'},
        h('select',{value:md,onChange:e=>setMd(e.target.value),className:'px-2 py-1.5 rounded-lg border bg-white text-sm'},h('option',{value:'default'},'Default'),h('option',{value:'code'},'Code'),h('option',{value:'creative'},'Creative')),
        h('input',{value:ip,onChange:e=>setIp(e.target.value),onKeyDown:e=>e.key==='Enter'&&snd(),placeholder:'Type a message...',className:'flex-1 px-3 py-1.5 rounded-lg border bg-white text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none'}),
        h(B,{onClick:snd},I.send(16))
      )
    )
  )
}

    h('aside',{className:'w-full md:w-64 bg-white border-r border-gray-200 p-4 flex flex-col gap-2'},
      h('div',{className:'font-bold text-xl text-indigo-600 mb-4 px-2 flex items-center gap-2'},I.bolt(20),'Luqi AI'),
      h('button',{onClick:()=>setPage('dashboard'),className:`text-left px-3 py-2 rounded-lg text-sm font-medium ${page==='dashboard'?'bg-indigo-50 text-indigo-600':'text-gray-700 hover:bg-gray-100'}`},'Dashboard'),
      h('button',{onClick:()=>setPage('chat'),className:`text-left px-3 py-2 rounded-lg text-sm font-medium ${page==='chat'?'bg-indigo-50 text-indigo-600':'text-gray-700 hover:bg-gray-100'}`},'Chat'),
      h('button',{onClick:()=>setPage('companion'),className:`text-left px-3 py-2 rounded-lg text-sm font-medium ${page==='companion'?'bg-indigo-50 text-indigo-600':'text-gray-700 hover:bg-gray-100'}`},'Companion')
    ),
    h('main',{className:'flex-1 p-6 overflow-y-auto'},
      page==='dashboard'?h(DashboardPage):
      page==='chat'?h(ChatPage):
      h(CompanionPage)
    )
  );
}

const root = createRoot(document.getElementById('r'));
root.render(h(App));
</script>
</body>
