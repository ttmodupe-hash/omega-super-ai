# ==============================================================================
# LUQI-AI REVERSE PROXY & CRYPTOGRAPHIC ISOLATION LAYER (v5.5)
# Install: see deploy/DEPLOYMENT.md section 'Edge proxy (Nginx)'.
# Enhancements over the pasted baseline: HTTP/2, edge rate limiting, body caps,
# OCSP stapling, streaming-friendly voice route, websocket keepalive tuning.
# ==============================================================================

# Edge rate limiting: burst budget for expensive public endpoints.
# 10 r/s per IP with 20-burst bucket; auth endpoints get a stricter zone.
limit_req_zone $binary_remote_addr zone=luqi_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=luqi_auth:10m rate=2r/s;

# 1. Force absolute redirection of unencrypted cleartext traffic
server {
    listen 80;
    listen [::]:80;
    server_name api.luqi-ai.org;
    return 301 https://$host$request_uri;
}

# 2. Secure TLS 1.3 production matrix
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.luqi-ai.org;

    # Disallow legacy protocols; prefer server cipher order
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Certificate hooks (certbot)
    ssl_certificate /etc/letsencrypt/live/api.luqi-ai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.luqi-ai.org/privkey.pem;

    # OCSP stapling: faster, more private handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers.
    # NOTE: CSP keeps 'unsafe-inline' because dashboard pages ship inline <script>.
    # Future hardening: extract inline JS to files, then drop 'unsafe-inline'
    # and the http:/https: sources to a strict policy.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Body cap: PWA payloads + webhook bodies, nothing monstrous
    client_max_body_size 10m;

    # Streaming voice synthesis: disable proxy buffering so audio starts immediately
    location /v1/voice/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Live WebSocket terminal tunnels: long keepalive, upgrade headers
    location /v1/labs/terminal/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Auth endpoints: strictest edge rate limit (backstop to the app limiter)
    location /v1/auth/ {
        limit_req zone=luqi_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main REST gateway: general edge rate limit + generous streaming timeouts
    location / {
        limit_req zone=luqi_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
