<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19"><title>Luqi-AI // My Certificates</title>
<link rel="manifest" href="/manifest.json">
<style>
body{margin:0;background:#0b0f19;color:#f1f5f9;font-family:system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{color:#10b981;font-size:20px}.sub{color:#64748b;font-size:12px;margin-bottom:14px}
a.back{color:#60a5fa;font-size:12px;text-decoration:none}
.card{background:#0d1222;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:10px}
.cert{border-left:4px solid #10b981}
.skill{display:inline-block;background:#121824;border:1px solid #1e293b;border-radius:14px;
  padding:4px 12px;font-size:12px;margin:3px;color:#cbd5e1}
.btn{background:#059669;border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;
  cursor:pointer;text-decoration:none;display:inline-block}
.meta{font-size:11px;color:#64748b;margin-top:6px}
.empty{color:#64748b;font-size:13px;padding:20px;text-align:center}
.stat{display:inline-block;margin-right:18px;font-size:13px}.stat b{color:#10b981;font-size:18px}
</style></head><body><div class="wrap">
<h1>&#127942; My Certificates & Skills</h1>
<div class="sub">Verified trade skills &middot; <a class="back" href="/">&larr; Portal</a> &middot; <a class="back" href="/dashboard.html">Cockpit &rarr;</a></div>
<div id="stats" style="margin-bottom:14px"></div>
<div id="certs"></div>
<script>
const token = sessionStorage.getItem('luqi_user_token') || '';
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
async function load() {
  if (!token) { document.getElementById('certs').innerHTML =
    '<div class="empty">Sign in first (auth token from /v1/auth/login) to view your certificates.</div>'; return; }
  const [profile, certs] = await Promise.all([
    fetch('/v1/skills/profile', { headers: H }).then(r => r.ok ? r.json() : null),
    fetch('/v1/skills/certificates', { headers: H }).then(r => r.ok ? r.json() : null),
  ]);
  if (profile) {
    document.getElementById('stats').innerHTML =
      `<span class="stat"><b>${profile.verified_skills.length}</b> skills</span>` +
      `<span class="stat"><b>${profile.hours}</b> credit hours</span>` +
      `<span class="stat"><b>${profile.verified_skills.length * 20}%</b> toward first certificate (5 skills)</span>` +
      profile.verified_skills.map(s => `<span class="skill">${s}</span>`).join('');
  }
  const list = (certs && certs.certificates) || [];
  document.getElementById('certs').innerHTML = list.length ? list.map(c => `
    <div class="card cert">
      <div style="font-weight:700;font-size:16px">${c.trade}</div>
      <div class="meta">${c.certificate_id} &middot; issued ${c.issued_at}</div>
      <div style="margin-top:8px">
        <a class="btn" href="/v1/credentials/verify/${c.certificate_id}" target="_blank">Verify (public)</a>
        <button class="btn" style="background:#1e293b" onclick="navigator.clipboard.writeText('${c.verification_url}')">Copy proof link</button>
      </div>
    </div>`).join('')
    : '<div class="empty">No certificates yet - verify 5 skills in a trade to earn your first one.</div>';
}
load();
</script></div></body></html>
